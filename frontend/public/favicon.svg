<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>UniChamada</title>
  <!-- Variante compacta da marca: 3 por 2 com uma lacuna. Abaixo de 24px um
       contorno de 1px não sobrevive, então a célula vazia some em vez de virar
       contorno, e a grade perde uma coluna e uma linha. -->
  <rect width="64" height="64" rx="14" fill="#2563eb"/>
  <g fill="#ffffff">
    <rect x="7" y="16" width="14" height="14" rx="3.5"/>
    <rect x="25" y="16" width="14" height="14" rx="3.5"/>
    <rect x="7" y="34" width="14" height="14" rx="3.5"/>
    <rect x="25" y="34" width="14" height="14" rx="3.5"/>
    <rect x="43" y="34" width="14" height="14" rx="3.5"/>
  </g>
</svg>
